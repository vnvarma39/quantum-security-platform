version: "3.9"

services:

  # ── Frontend (React + Vite) ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./src:/app/src:ro
    depends_on:
      - backend
    networks:
      - qsip-net

  # ── Backend (FastAPI + Quantum Engine) ────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://qsip:qsip@postgres:5432/qsip
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
    networks:
      - qsip-net

  # ── Celery Worker (background validation tasks) ────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A backend.tasks worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://qsip:qsip@postgres:5432/qsip
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    networks:
      - qsip-net

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qsip
      POSTGRES_PASSWORD: qsip
      POSTGRES_DB: qsip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsip"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsip-net

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - qsip-net

volumes:
  postgres_data:
  redis_data:

networks:
  qsip-net:
    driver: bridge
